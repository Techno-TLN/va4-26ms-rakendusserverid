<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>K-TVA4-26MS – Eesnimi Perenimi</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    code { background: #eee; padding: 0.1rem 0.3rem; border-radius: 3px; }
    footer { margin-top: 3rem; color: #666; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Tere! Mina olen Eesnimi Perenimi</h1>
  <p>See leht jõudis serverisse läbi deploy protsessi.</p>

  <h2>Märkmed API-st</h2>
  <ul id="notes"><li>(3. kohtumisel tuleb siia API andmed)</li></ul>

  <footer>K-TVA4-26MS · versioon 1</footer>

  <script>
    // Töötab alles siis, kui serveris jookseb app/ (3. kohtumine)
    fetch('/api/notes')
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(notes => {
        const ul = document.getElementById('notes');
        ul.innerHTML = '';
        for (const n of notes) {
          const li = document.createElement('li');
          li.textContent = n.text;
          ul.appendChild(li);
        }
      })
      .catch(() => {});
  </script>
</body>
</html>
